[[person.feed]]
url = "https://export.arxiv.org/api/query?search_query=au:Aaronson_Scott&sortBy=submittedDate&sortOrder=descending&max_results=10"
label = "arXiv"
kind = "paper"
topics = ["math", "ai-future"]



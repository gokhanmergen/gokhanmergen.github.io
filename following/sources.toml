# People shown on following.html, in this order. Build with
# python3 build_following.py; see BLOG_WORKFLOW.md, "The following page".
#
# Each person has an `id` (the card's anchor), `name`, `role`, `topics` (ids
# from interests.toml, the main one first) and `why`, plus:
#   [[person.channel]]  where they publish: label, url, optional note
#   [[person.start]]    what to read first: title, url, optional note
#   [[person.feed]]     what the page reads every day: url, label, and
#                       optionally kind (post, paper, podcast, video, report;
#                       default post), topics, match_topics, exclude,
#                       max_items, summary

[page]
eyebrow = "Worth following · updated daily"
title = "People worth following"
lede = "The people I read on the subjects I write about: where each of them publishes, what to read first, and what they have published lately. The list of new work updates itself every day."


# AI safety & the future

[[person]]
id = "scott-aaronson"
name = "Scott Aaronson"
role = "Quantum computing and complexity theorist, UT Austin"
topics = ["ai-future", "math"]
why = "He spent two years at OpenAI working on AI safety and watermarking, and writes on AI with a complexity theorist's precision. Nearly everything he publishes goes through his blog, and some of his sharpest arguments are in his replies in the comment threads."

[[person.channel]]
label = "Shtetl-Optimized"
url = "https://scottaaronson.blog/"
note = "blog"

[[person.channel]]
label = "Complexity posts only"
url = "https://scottaaronson.blog/?cat=5&feed=rss2"
note = "RSS"

[[person.channel]]
label = "Google Scholar"
url = "https://scholar.google.com/citations?user=EYv2BNQAAAAJ"
note = "email alerts for new papers"

[[person.start]]
title = "Quantum Computing Since Democritus"
url = "https://en.wikipedia.org/wiki/Quantum_Computing_Since_Democritus"
note = "book, 2013"

[[person.start]]
title = "Why Philosophers Should Care About Computational Complexity"
url = "https://arxiv.org/abs/1108.1791"
note = "essay, 2011"

[[person.feed]]

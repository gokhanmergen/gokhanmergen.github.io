# Topics for following.html, in the order the page shows them.
#
# `categories` maps the `category` field of the posts in posts/ onto a topic.
# build_following.py warns about any post category that maps to no topic and
# isn't in `ignore_categories`, so writing about a new subject shows up as a
# gap to fill here and in sources.toml.
#
# `keywords` decide which of a person's topics each new item belongs to, and
# which items a feed with `match_topics = true` keeps. They match whole words,
# ignoring case; a trailing * matches any ending ("autonom*" matches
# "autonomy" and "autonomous").

ignore_categories = ["Ideas / Quotations", "Books / Markets"]

[[topic]]
id = "ai-future"
label = "AI safety & the future"
categories = [
  "AI / Safety", "ASI / Society", "Futures / AI", "Ideas / AI futures",
  "Humanity / AI", "Culture / AI", "Culture / Discovery",
]
keywords = [
  "AI", "A.I.", "AGI", "ASI", "artificial intelligence", "superintelligen*",
  "alignment", "misalign*", "safety", "x-risk", "existential", "autonom*",
  "agent", "agents", "agentic", "LLM*", "language model*", "frontier",
  "OpenAI", "Anthropic", "DeepMind", "Claude", "GPT*", "Gemini", "chatbot*",
  "interpretab*", "scheming", "watermark*", "singularity", "takeoff",
  "doom*", "red-team*", "evals", "evaluation*", "monitoring",
]


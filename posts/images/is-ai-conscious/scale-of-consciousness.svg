<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" width="760" height="336" role="img" aria-labelledby="fig-title fig-desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title id="fig-title">Consciousness comes in degrees; personhood is a separate line</title>
  <desc id="fig-desc">How I place living things, and where AI fits today. A zone labeled "Some consciousness, no personhood" holds plants (lettuce, trees, sequoias), animals (fish, chickens, cows) and, in a dashed box, AI today: likely some consciousness and inner monologue, but not alive the way even a fish or a cow is. A separate, highlighted zone labeled "Personhood" holds humans, with respect as persons, and the note: AI stays outside it, not now, not anytime soon. An arrow along the bottom shows the degree of consciousness, from lower to higher.</desc>
  <defs>
    <marker id="scale-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#98a2b3"/>
    </marker>
  </defs>
  <rect width="760" height="336" fill="#ffffff"/>

  <text x="24" y="28" font-size="15" font-weight="600" fill="#172033">Consciousness comes in degrees; personhood is a separate line</text>
  <text x="24" y="48" font-size="11.5" fill="#667085">How I place living things, and where AI fits today</text>

  <!-- Zone: some consciousness, no personhood -->
  <rect x="24" y="68" width="480" height="196" rx="8" fill="none" stroke="#98a2b3" stroke-width="1.25"/>
  <text x="40" y="90" font-weight="600" fill="#172033">Some consciousness, no personhood</text>

  <rect x="40" y="104" width="216" height="56" rx="8" fill="none" stroke="#98a2b3" stroke-width="1.25"/>
  <text x="148" y="128" text-anchor="middle" font-weight="600" fill="#172033">Plants</text>
  <text x="148" y="144" text-anchor="middle" font-size="11.5" fill="#667085">Lettuce, trees, sequoias</text>

  <rect x="272" y="104" width="216" height="56" rx="8" fill="none" stroke="#98a2b3" stroke-width="1.25"/>
  <text x="380" y="128" text-anchor="middle" font-weight="600" fill="#172033">Animals</text>
  <text x="380" y="144" text-anchor="middle" font-size="11.5" fill="#667085">Fish, chickens, cows</text>

  <rect x="40" y="176" width="448" height="72" rx="8" fill="none" stroke="#98a2b3" stroke-width="1.25" stroke-dasharray="4 4"/>
  <text x="264" y="200" text-anchor="middle" font-weight="600" fill="#172033">AI today</text>
  <text x="264" y="216" text-anchor="middle" font-size="11.5" fill="#667085">Likely some consciousness and inner monologue,</text>
  <text x="264" y="232" text-anchor="middle" font-size="11.5" fill="#667085">but not alive the way even a fish or a cow is</text>

  <!-- Zone: personhood -->
  <rect x="536" y="68" width="200" height="196" rx="8" fill="#3563e9" fill-opacity="0.08" stroke="#3563e9" stroke-width="2"/>
  <text x="552" y="90" font-weight="600" fill="#172033">Personhood</text>

  <rect x="552" y="104" width="168" height="56" rx="8" fill="#ffffff" stroke="#98a2b3" stroke-width="1.25"/>
  <text x="636" y="128" text-anchor="middle" font-weight="600" fill="#172033">Humans</text>
  <text x="636" y="144" text-anchor="middle" font-size="11.5" fill="#667085">Respect as persons</text>

  <text x="552" y="200" font-size="11.5" fill="#172033">AI stays outside it:</text>
  <text x="552" y="216" font-size="11.5" fill="#172033">not now, not anytime soon</text>

  <!-- Axis -->
  <line x1="24" y1="292" x2="736" y2="292" stroke="#98a2b3" stroke-width="1.25" marker-end="url(#scale-arrow)"/>
  <text x="24" y="314" font-size="11.5" fill="#667085">Degree of consciousness, from lower to higher</text>
</svg>

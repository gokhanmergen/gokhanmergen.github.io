<svg width="760" height="354" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 354" role="img" aria-label="Under every accounting choice, Republican borrowing outside emergencies is larger" font-size="12"><rect x="0" y="0" width="760" height="354" fill="#ffffff"/><text data-claude-text-id="title" x="16" y="24" font-size="16" font-weight="600" fill="#1a1a1a">Under every accounting choice, Republican borrowing outside emergencies is larger</text><text data-claude-text-id="sub" x="16" y="44" fill="#5c5c5c">Non-emergency laws, ten-year cost as % of GDP in the year each passed, summed by party</text><g data-claude-anchor="legend"><g><circle cx="22" cy="70" r="6" fill="#C8463D"></circle><text x="34" y="74" fill="#1a1a1a">Republican</text></g><g><circle cx="152" cy="70" r="6" fill="#2F6CB3"></circle><text x="164" y="74" fill="#1a1a1a">Democratic</text></g></g><line x1="358.46153846153845" x2="358.46153846153845" y1="106" y2="332" stroke="#8a8a8a"></line><text x="358.46153846153845" y="348" text-anchor="middle" font-size="10" fill="#5c5c5c">0</text><g data-claude-anchor="case-base"><text x="16" y="138" fill="#1a1a1a">Base case: by who voted for it</text><line x1="347.6461538461538" x2="573.0615384615385" y1="134" y2="134" stroke="#8f8f8f" stroke-width="3"></line><circle cx="347.6461538461538" cy="134" r="6" fill="#2F6CB3"><title>Base case: by who voted for it: Democratic −1.9% of GDP</title></circle><circle cx="573.0615384615385" cy="134" r="6" fill="#C8463D"><title>Base case: by who voted for it: Republican 37.7% of GDP</title></circle><text x="336.6461538461538" y="138" text-anchor="end" font-size="11" fill="#1a1a1a">−1.9%</text><text x="584.0615384615385" y="138" font-size="11" fill="#1a1a1a">37.7%</text></g><g data-claude-anchor="case-atrar"><text x="16" y="182" fill="#1a1a1a">Charge the 2013 extension to Republicans</text><line x1="347.6461538461538" x2="666.4153846153847" y1="178" y2="178" stroke="#8f8f8f" st
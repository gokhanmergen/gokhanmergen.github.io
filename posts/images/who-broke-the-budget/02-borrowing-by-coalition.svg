<svg width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 330" role="img" aria-label="Outside emergencies, Republican-led laws added 38% of a year’s GDP" font-size="12"><rect x="0" y="0" width="760" height="330" fill="#ffffff"/><text data-claude-text-id="title" x="16" y="24" font-size="16" font-weight="600" fill="#1a1a1a">Outside emergencies, Republican-led laws added 38% of a year’s GDP</text><text x="16" y="44" fill="#5c5c5c">Democratic-led laws outside emergencies: −1.9%. Bipartisan laws: 24.6%.</text><text data-claude-text-id="method" x="16" y="60" fill="#5c5c5c">Each law’s ten-year cost at enactment as a share of GDP in the year it passed, summed by who voted for it</text><g data-claude-anchor="legend"><rect x="16" y="76" width="14" height="12" fill="#5c5c5c" fill-opacity="0.85"></rect><text data-claude-text-id="leg-non" x="36" y="86" fill="#1a1a1a">Outside emergencies</text><rect x="190" y="76" width="14" height="12" fill="#5c5c5c" fill-opacity="0.25" stroke="#5c5c5c"></rect><text data-claude-text-id="leg-em" x="210" y="86" fill="#1a1a1a">Emergencies (2008–09 crisis, COVID)</text></g><line x1="231" x2="231" y1="104" y2="308" stroke="#8a8a8a"></line><g data-claude-anchor="coalition-rep"><text x="16" y="140" font-weight="600" fill="#1a1a1a">Republican-led</text><g><rect x="231" y="112" width="384.53999999999996" height="18" fill="#C8463D" fill-opacity="0.9" stroke="#C8463D"><title>Republican-led, outside emergencies: 37.7% of GDP, $6.9T</title></rect><text x="621.54" y="125" fill="#1a1a1a">37.7%  ·  $6.9T</text></g><g><rect x="231" y="136" width="0" height="18" fill="#C8463D" fill-opacity="0.25" stroke="#C8463D"><title>Republican-led, emergencies: 0.0% of GDP, $0.0T</title></rect><text x="237" y="149" fill="#1a1a1a">none</text></g></g><g data-claude-anchor="coalition-dem"><text x="16" y="210" font-weight="600" fill="#1a1a1a">Democratic-led</text><g><rect x="211.62" y="182" width="19.379999999999995" height="18" fill="#2F6CB3" fill-opacity="0.9" stroke="#2F6CB3"><title>Democratic-led, outside emergencies: −1.9% of GDP, −$0.4T</title></rect><text x="237" y="195" fill="#1a1a1a">−1.9%  ·  −$0.4T</text></g><g><rect x="231" y="206" width="138.72000000000003" height="18" fill="#2F6CB3" fill-opacity="0.25" stroke="#2F6CB3"><title>Democratic-led, emergencies: 13.6% of GDP, $2.7T</title></rect><text x="375.72" y="219" fill="#1a1a1a">13.6%  ·  $2.7T</text></g></g><g data-claude-anchor="coalition-bip"><text x="16" y="280" font-weight="600" fill="#1a1a1a">Bipartisan</text><g><rect x="231" y="252" width="250.92000000000002" height="18" fill="#7B5EA7" fill-opacity="0.9" stroke="#7B5EA7"><title>Bipartisan, outside emergencies: 24.6% of GDP, $3.8T</title></rect><text x="487.92" y="265" fill="#1a1a1a">24.6%  ·  $3.8T</text></g><g><rect x="231" y="276" width="175.44" height="18" fill="#7B5EA7" fill-opacity="0.25" stroke="#7B5EA7"><title>Bipartisan, emergencies: 17.2% of GDP, $3.6T</title></rect><text x="412.44" y="289" fill="#1a1a1a">17.2%  ·  $3.6T</text></g></g></svg>
<svg width="760" height="648" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 648" role="img" aria-label="Tax cuts and the deals extending them dominate non-emergency borrowing" font-size="12"><rect x="0" y="0" width="760" height="648" fill="#ffffff"/><text data-claude-text-id="title" x="16" y="24" font-size="16" font-weight="600" fill="#1a1a1a">Tax cuts and the deals extending them dominate non-emergency borrowing</text><text x="16" y="44" fill="#5c5c5c">Bush and Trump tax cuts plus the deals extending them: 56.4% of GDP, 69% of all non-emergency additions</text><text data-claude-text-id="note-cuts" x="16" y="60" fill="#5c5c5c">Every major law that cut deficits passed under a Democratic president; two were forced by Republican Houses.</text><g data-claude-anchor="legend"><g><rect x="16" y="76" width="12" height="12" fill="#C8463D" fill-opacity="0.9"></rect><text x="34" y="86" fill="#1a1a1a">Republican-led</text></g><g><rect x="156" y="76" width="12" height="12" fill="#7B5EA7" fill-opacity="0.9"></rect><text x="174" y="86" fill="#1a1a1a">Bipartisan</text></g><g><rect x="296" y="76" width="12" height="12" fill="#2F6CB3" fill-opacity="0.9"></rect><text x="314" y="86" fill="#1a1a1a">Democratic-led</text></g><rect x="436" y="76" width="12" height="12" fill="#5c5c5c" fill-opacity="0.25" stroke="#5c5c5c"></rect><text data-claude-text-id="leg-em" x="454" y="86" fill="#1a1a1a">Lighter: emergency response</text></g><text data-claude-text-id="dir-left" x="454" y="110" text-anchor="end" font-size="11" fill="#5c5c5c">← cut deficits</text><text data-claude-text-id="dir-right" x="466" y="110" font-size="11" fill="#5c5c5c">added to deficits →</text><line x1="460" x2="460" y1="118" y2="636" stroke="#8a8a8a"></line><g data-claude-anchor="group-rep"><rect x="16" y="127" width="10" height="10" fill="#C8463D"></rect><text x="32" y="136" fill="#1a1a1a"><tspan font-weight="600" fill="#1a1a1a">Republican-led</tspan><tspan fill="#5c5c5c">   37.7% outside emergencies</tspan></text><g><text x="16" y="157" font-size="11" fill="#5c5c5c">2001</text><text x="64" y="157" fill="#1a1a1a">Bush tax cut (EGTRRA)</text><rect x="460" y="146" width="153.5999999999999" height="13" fill="#C8463D" fill-opacity="0.9" stroke="#C8463D"><title>2001 Bush tax cut (EGTRRA): 12.8% of that year’s GDP ($1,350 billion)</title></rect><text x="618.5999999999999" y="157" font-size="11" fill="#1a1a1a">12.8%</text></g><g><text x="16" y="176" font-size="11" fill="#5c5c5c">2003</text><text x="64" y="176" fill="#1a1a1a">Bush tax cut (JGTRRA)</text><rect x="460" y="165" width="34.799999999999955" height="13" fill="#C8463D" fill-opacity="0.9" stroke="#C8463D"><title>2003 Bush tax cut (JGTRRA): 2.9% of that year’s GDP ($330 billion)</title></rect><text x="499.79999999999995" y="176" font-size="11" fill="#1a1a1a">2.9%</text></g><g><text x="16" y="195" font-size="11" fill="#5c5c5c">2003</text><text x="64" y="195" fill="#1a1a1a">Medicare Part D</text><rect x="460" y="184" width="40.799999999999955" height="13" fill="#C8463D" fill-opacity="0.9" stroke="#C8463D"><title>2003 Medicare Part D: 3.4% of that year’s GDP ($395 billion)</title></rect><text x="505.79999999999995" y="195" font-size="11" fill="#1a1a1a">3.4%</text></g><g><text x="16" y="214" font-size="11" fill="#5c5c5c">2017</text><text x="64" y="214" fill="#1a1a1a">Trump tax cut (TCJA)</text><rect x="460" y="203" width="88.79999999999995" height="13" fill="#C8463D" fill-opacity="0.9" stroke="#C8463D"><title>2017 Trump tax cut (TCJA): 7.4% of that year’s GDP ($1,456 billion)</title></rect><text x="553.8" y="214" font-size="11" fill="#1a1a1a">7.4%</text></g><g><text x="16" y="233" font-size="11" fill="#5c5c5c">2025</text><text x="64" y="233" fill="#1a1a1a">Trump tax law (OBBBA)</text><rect x="460" y="222" width="134.39999999999998" height="13" fill="#C8463D" fill-opacity="0.9" stroke="#C8463D"><title>2025 Trump tax law (OBBBA): 11.2% of that year’s GDP ($3,400 billion)</title></rect><text x="599.4" y="233" font-size="11" fill="#1a1a1a">11.2%</text></g></g><g data-claude-anchor="group-bip"><rect x="16" y="258" width="10" height="10" fill="#7B5EA7"></rect><text x="32" y="267" fill="#1a1a1a"><tspan font-weight="600" fill="#1a1a1a">Bipartisan</tspan><tspan fill="#5c5c5c">   24.6% outside emergencies, 17.2% in emergencies</tspan></text><g><text x="16" y="288" font-size="11" fill="#5c5c5c">2001–14</text><text x="64" y="288" fill="#1a1a1a">Afghanistan and Iraq wars</text><rect x="460" y="277" width="133.20000000000005" height="13" fill="#7B5EA7" fill-opacity="0.9" stroke="#7B5EA7"><title>2001–14 Afghanistan and Iraq wars: 11.1% of that year’s GDP ($1,600 billion)</title></rect><text x="598.2" y="288" font-size="11" fill="#1a1a1a">11.1%</text></g><g><text x="16" y="307" font-size="11" fill="#5c5c5c">2008</text><text x="64" y="307" fill="#1a1a1a">Stimulus and TARP (net)</text><rect x="460" y="296" width="14.399999999999977" height="13" fill="#7B5EA7" fill-opacity="0.25" stroke="#7B5EA7"><title>2008 Stimulus and TARP (net): 1.2% of that year’s GDP ($183 billion)</title></rect><text x="479.4" y="307" font-size="11" fill="#1a1a1a">1.2%</text></g><g><text x="16" y="326" font-size="11" fill="#5c5c5c">2010</text><text x="64" y="326" fill="#1a1a1a">Tax deal (Bush cuts extended)</text><rect x="460" y="315" width="68.39999999999998" height="13" fill="#7B5EA7" fill-opacity="0.9" stroke="#7B5EA7"><title>2010 Tax deal (Bush cuts extended): 5.7% of that year’s GDP ($858 billion)</title></rect><text x="533.4" y="326" font-size="11" fill="#1a1a1a">5.7%</text></g><g><text x="16" y="345" font-size="11" fill="#5c5c5c">2011</text><text x="64" y="345" fill="#1a1a1a">Budget Control Act</text><rect x="298" y="334" width="162" height="13" fill="#7B5EA7" fill-opacity="0.9" stroke="#7B5EA7"><title>2011 Budget Control Act: −13.5% of that year’s GDP ($-2,100 billion)</title></rect><text x="465" y="345" font-size="11" fill="#1a1a1a">−13.5%</text></g><g><text x="16" y="364" font-size="11" fill="#5c5c5c">2013</text><text x="64" y="364" fill="#1a1a1a">Bush cuts made permanent (ATRA)</text><rect x="460" y="353" width="196.79999999999995" height="13" fill="#7B5EA7" fill-opacity="0.9" stroke="#7B5EA7"><title>2013 Bush cuts made permanent (ATRA): 16.4% of that year’s GDP ($2,776 billion)</title></rect><text x="661.8" y="364" font-size="11" fill="#1a1a1a">16.4%</text></g><g><text x="16" y="383" font-size="11" fill="#5c5c5c">2015</text><text x="64" y="383" fill="#1a1a1a">Tax extenders made permanent</text><rect x="460" y="372" width="40.799999999999955" height="13" fill="#7B5EA7" fill-opacity="0.9" stroke="#7B5EA7"><title>2015 Tax extenders made permanent: 3.4% of that year’s GDP ($622 billion)</title></rect><text x="505.79999999999995" y="383" font-size="11" fill="#1a1a1a">3.4%</text></g><g><text x="16" y="402" font-size="11" fill="#5c5c5c">2018</text><text x="64" y="402" fill="#1a1a1a">Spending-cap deal</text><rect x="460" y="391" width="18" height="13" fill="#7B5EA7" fill-opacity="0.9" stroke="#7B5EA7"><title>2018 Spending-cap deal: 1.5% of that year’s GDP ($320 billion)</title></rect><text x="483" y="402" font-size="11" fill="#1a1a1a">1.5%</text></g><g><text x="16" y="421" font-size="11" fill="#5c5c5c">2019</text><text x="64" y="421" fill="#1a1a1a">Spending-cap deal</text><rect x="460" y="410" width="18" height="13" fill="#7B5EA7" fill-opacity="0.9" stroke="#7B5EA7"><title>2019 Spending-cap deal: 1.5% of that year’s GDP ($320 billion)</title></rect><text x="483" y="421" font-size="11" fill="#1a1a1a">1.5%</text></g><g><text x="16" y="440" font-size="11" fill="#5c5c5c">2019</text><text x="64" y="440" fill="#1a1a1a">ACA tax repeal</text><rect x="460" y="429" width="20.399999999999977" height="13" fill="#7B5EA7" fill-opacity="0.9" stroke="#7B5EA7"><title>2019 ACA tax repeal: 1.7% of that year’s GDP ($373 billion)</title></rect><text x="485.4" y="440" font-size="11" fill="#1a1a1a">1.7%</text></g><g><text x="16" y="459" font-size="11" fill="#5c5c5c">2020</text><text x="64" y="459" fill="#1a1a1a">COVID relief (four laws)</text><rect x="460" y="448" width="192" height="13" fill="#7B5EA7" fill-opacity="0.25" stroke="#7B5EA7"><title>2020 COVID relief (four laws): 16.0% of that year’s GDP ($3,415 billion)</title></rect><text x="657" y="459" font-size="11" fill="#1a1a1a">16.0%</text></g><g><text x="16" y="478" font-size="11" fill="#5c5c5c">2021</text><text x="64" y="478" fill="#1a1a1a">Infrastructure law</text><rect x="460" y="467" width="13.200000000000045" height="13" fill="#7B5EA7" fill-opacity="0.9" stroke="#7B5EA7"><title>2021 Infrastructure law: 1.1% of that year’s GDP ($256 billion)</title></rect><text x="478.20000000000005" y="478" font-size="11" fill="#1a1a1a">1.1%</text></g><g><text x="16" y="497" font-size="11" fill="#5c5c5c">2022</text><text x="64" y="497" fill="#1a1a1a">PACT Act (veterans)</text><rect x="460" y="486" width="13.200000000000045" height="13" fill="#7B5EA7" fill-opacity="0.9" stroke="#7B5EA7"><title>2022 PACT Act (veterans): 1.1% of that year’s GDP ($280 billion)</title></rect><text x="478.20000000000005" y="497" font-size="11" fill="#1a1a1a">1.1%</text></g><g><text x="16" y="516" font-size="11" fill="#5c5c5c">2023</text><text x="64" y="516" fill="#1a1a1a">Fiscal Responsibility Act</text><rect x="395.2" y="505" width="64.80000000000001" height="13" fill="#7B5EA7" fill-opacity="0.9" stroke="#7B5EA7"><title>2023 Fiscal Responsibility Act: −5.4% of that year’s GDP ($-1,500 billion)</title></rect><text x="465" y="516" font-size="11" fill="#1a1a1a">−5.4%</text></g></g><g data-claude-anchor="group-dem"><rect x="16" y="541" width="10" height="10" fill="#2F6CB3"></rect><text x="32" y="550" fill="#1a1a1a"><tspan font-weight="600" fill="#1a1a1a">Democratic-led</tspan><tspan fill="#5c5c5c">   −1.9% outside emergencies, 13.6% in emergencies</tspan></text><g><text x="16" y="571" font-size="11" fill="#5c5c5c">2009</text><text x="64" y="571" fill="#1a1a1a">Recovery Act</text><rect x="460" y="560" width="68.39999999999998" height="13" fill="#2F6CB3" fill-opacity="0.25" stroke="#2F6CB3"><title>2009 Recovery Act: 5.7% of that year’s GDP ($831 billion)</title></rect><text x="533.4" y="571" font-size="11" fill="#1a1a1a">5.7%</text></g><g><text x="16" y="590" font-size="11" fill="#5c5c5c">2010</text><text x="64" y="590" fill="#1a1a1a">Affordable Care Act</text><rect x="448" y="579" width="12" height="13" fill="#2F6CB3" fill-opacity="0.9" stroke="#2F6CB3"><title>2010 Affordable Care Act: −1.0% of that year’s GDP ($-143 billion)</title></rect><text x="465" y="590" font-size="11" fill="#1a1a1a">−1.0%</text></g><g><text x="16" y="609" font-size="11" fill="#5c5c5c">2021</text><text x="64" y="609" fill="#1a1a1a">American Rescue Plan</text><rect x="460" y="598" width="94.79999999999995" height="13" fill="#2F6CB3" fill-opacity="0.25" stroke="#2F6CB3"><title>2021 American Rescue Plan: 7.9% of that year’s GDP ($1,860 billion)</title></rect><text x="559.8" y="609" font-size="11" fill="#1a1a1a">7.9%</text></g><g><text x="16" y="628" font-size="11" fill="#5c5c5c">2022</text><text x="64" y="628" fill="#1a1a1a">Inflation Reduction Act</text><rect x="449.2" y="617" width="10.800000000000011" height="13" fill="#2F6CB3" fill-opacity="0.9" stroke="#2F6CB3"><title>2022 Inflation Reduction Act: −0.9% of that year’s GDP ($-238 billion)</title></rect><text x="465" y="628" font-size="11" fill="#1a1a1a">−0.9%</text></g></g></svg>
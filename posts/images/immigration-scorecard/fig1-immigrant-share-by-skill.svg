<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 760 330" role="img" aria-label="Immigrants are 15% of residents but 43% to 58% of science and engineering PhDs" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="32" font-size="16" font-weight="600" fill="#0b0b0b">Immigrants are 15% of residents but 43%–58% of science and engineering PhDs</text><text x="24" y="54" font-size="12" fill="#52514e">Foreign-born share of each group, %, latest data (2021–2025)</text><g><g><text x="224" y="108" text-anchor="end" fill="#0b0b0b">All U.S. residents</text><rect x="236" y="92" width="67.75999999999999" height="24" rx="3" fill="#c3c2b7"><title>All U.S. residents: 15.4% foreign-born</title></rect><text x="311.76" y="108" font-weight="400" fill="#0b0b0b">15.4%</text></g><g><text x="224" y="152" text-anchor="end" fill="#0b0b0b">Civilian labor force</text><rect x="236" y="136" width="84.04000000000002" height="24" rx="3" fill="#c3c2b7"><title>Civilian labor force: 19.1% foreign-born</title></rect><text x="328.04" y="152" font-weight="400" fill="#0b0b0b">19.1%</text></g><g><text x="224" y="196" text-anchor="end" fill="#0b0b0b">Doctorates in S&amp;E jobs</text><rect x="236" y="180" width="189.2" height="24" rx="3" fill="#2a78d6"><title>Doctorates in S&amp;E jobs: 43% foreign-born</title></rect><text x="433.2" y="196" font-weight="600" fill="#0b0b0b">43%</text></g><g><text x="224" y="240" text-anchor="end" fill="#0b0b0b">Engineering doctorates</text><rect x="236" y="224" width="246.40000000000003" height="24" rx="3" fill="#2a78d6"><title>Engineering doctorates: 56% foreign-born</title></rect><text x="490.40000000000003" y="240" font-weight="600" fill="#0b0b0b">56%</text></g><g><text x="224" y="284" text-anchor="end" fill="#0b0b0b">Computer &amp; math doctorates</text><rect x="236" y="268" width="255.2" height="24" rx="3" fill="#2a78d6"><title>Computer &amp; math doctorates: 58% foreign-born</title></rect><text x="499.2" y="284" font-weight="600" fill="#0b0b0b">58%</text></g></g><line x1="236" x2="236" y1="84" y2="300" stroke="#c1c1c1"></line></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="370" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 760 370" role="img" aria-label="Immigrant share of U.S. Nobel laureates in physics, chemistry, and medicine" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="32" font-size="16" font-weight="600" fill="#0b0b0b">Since 2000, immigrants have won 40% of America’s science Nobels</text><text x="24" y="54" font-size="12" fill="#52514e">Immigrant share of U.S. Nobel laureates in physics, chemistry, and medicine, %</text><g><g><rect x="24" y="70" width="14" height="14" rx="3" fill="#2a78d6"></rect><text x="44" y="81" font-size="12" fill="#0b0b0b">2000–2025</text></g><g><rect x="144" y="70" width="14" height="14" rx="3" fill="#c3c2b7"></rect><text x="164" y="81" font-size="12" fill="#0b0b0b">1901–2025</text></g></g><g><g><text x="188" y="130" text-anchor="end" font-weight="400" fill="#0b0b0b">Physics</text><g><rect x="200" y="104" width="396" height="20" rx="3" fill="#2a78d6"><title>Physics, 2000–2025: 19 of 42 U.S. laureates were immigrants (45%)</title></rect><text x="604" y="118" font-weight="600" fill="#0b0b0b">45% (19 of 42)</text></g><g><rect x="200" y="128" width="334.4" height="20" rx="3" fill="#c3c2b7"><title>Physics, 1901–2025: 45 of 118 U.S. laureates were immigrants (38%)</title></rect><text x="542.4" y="142" font-weight="400" fill="#52514e">38%</text></g></g><g><text x="188" y="194" text-anchor="end" font-weight="400" fill="#0b0b0b">Chemistry</text><g><rect x="200" y="168" width="378.4" height="20" rx="3" fill="#2a78d6"><title>Chemistry, 2000–2025: 17 of 40 U.S. laureates were immigrants (43%)</title></rect><text x="586.4" y="182" font-weight="600" fill="#0b0b0b">43% (17 of 40)</text></g><g><rect x="200" y="192" width="334.4" height="20" rx="3" fill="#c3c2b7"><title>Chemistry, 1901–2025: 33 of 88 U.S. laureates were immigrants (38%)</title></rect><text x="542.4" y="206" font-weight="400" fill="#52514e">38%</text></g></g><g><text x="188" y="258" text-anchor="end" font-weight="400" fill="#0b0b0b">Physiology or medicine</text><g><rect x="200" y="232" width="281.6" height="20" rx="3" fill="#2a78d6"><title>Physiology or medicine, 2000–2025: 12 of 38 U.S. laureates were immigrants (32%)</title></rect><text x="489.6" y="246" font-weight="600" fill="#0b0b0b">32% (12 of 38)</text></g><g><rect x="200" y="256" width="290.40000000000003" height="20" rx="3" fill="#c3c2b7"><title>Physiology or medicine, 1901–2025: 40 of 123 U.S. laureates were immigrants (33%)</title></rect><text x="498.40000000000003" y="270" font-weight="400" fill="#52514e">33%</text></g></g><g><text x="188" y="322" text-anchor="end" font-weight="600" fill="#0b0b0b">All three</text><g><rect x="200" y="296" width="352" height="20" rx="3" fill="#2a78d6"><title>All three, 2000–2025: 48 of 120 U.S. laureates were immigrants (40%)</title></rect><text x="560" y="310" font-weight="600" fill="#0b0b0b">40% (48 of 120)</text></g><g><rect x="200" y="320" width="316.79999999999995" height="20" rx="3" fill="#c3c2b7"><title>All three, 1901–2025: 118 of 329 U.S. laureates were immigrants (36%)</title></rect><text x="524.8" y="334" font-weight="400" fill="#52514e">36%</text></g></g></g><line x1="200" x2="200" y1="96" y2="344" stroke="#c1c1c1"></line></svg>
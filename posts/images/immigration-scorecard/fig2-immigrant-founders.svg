<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 760 300" role="img" aria-label="Immigrants founded 55% of U.S. unicorns and 65% of top AI startups" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="32" font-size="16" font-weight="600" fill="#0b0b0b">Immigrants founded 55% of U.S. unicorns and 65% of top AI startups</text><text x="24" y="54" font-size="12" fill="#52514e">Share of companies with a founder who is an immigrant or a child of immigrants, %</text><g><g><rect x="24" y="70" width="14" height="14" rx="3" fill="#2a78d6" fill-opacity="1"></rect><text x="44" y="81" font-size="12" fill="#0b0b0b">Immigrant founder</text></g><g><rect x="224" y="70" width="14" height="14" rx="3" fill="#2a78d6" fill-opacity="0.4"></rect><text x="244" y="81" font-size="12" fill="#0b0b0b">Child of immigrants</text></g></g><g><g><text x="224" y="129" text-anchor="end" fill="#0b0b0b">Fortune 500 companies (2025)</text><rect x="236" y="112" width="82.84000000000003" height="26" fill="#2a78d6" fill-opacity="1"><title>Fortune 500 companies (2025): immigrant founder, 109 of 500 (22%)</title></rect><rect x="318.84000000000003" y="112" width="92.72000000000003" height="26" fill="#2a78d6" fill-opacity="0.4"><title>Fortune 500 companies (2025): child of immigrants, 122 of 500 (24%)</title></rect><text x="419.56" y="129" fill="#0b0b0b"><tspan font-weight="600">46%</tspan> (22% immigrant founders)</text></g><g><text x="224" y="181" text-anchor="end" fill="#0b0b0b">Billion-dollar startups (2022)</text><rect x="236" y="164" width="208.28178694158078" height="26" fill="#2a78d6" fill-opacity="1"><title>Billion-dollar startups (2022): immigrant founder, 319 of 582 (55%)</title></rect><rect x="444.2817869415808" y="164" width="33.29896907216494" height="26" fill="#2a78d6" fill-opacity="0.4"><title>Billion-dollar startups (2022): child of immigrants, 51 of 582 (9%)</title></rect><text x="485.5807560137457" y="181" fill="#0b0b0b"><tspan font-weight="600">64%</tspan> (55% immigrant founders)</text></g><g><text x="224" y="233" text-anchor="end" fill="#0b0b0b">Top AI startups (2023)</text><rect x="236" y="216" width="247.4418604651163" height="26" fill="#2a78d6" fill-opacity="1"><title>Top AI startups (2023): immigrant founder, 28 of 43 (65%)</title></rect><text x="491.4418604651163" y="233" fill="#0b0b0b"><tspan font-weight="600">65%</tspan></text></g></g><line x1="236" x2="236" y1="102" y2="254" stroke="#c1c1c1"></line><g><line x1="294.52" x2="294.52" y1="102" y2="254" stroke="#878787" stroke-dasharray="4 4"></line><text x="290.52" y="274" font-size="11.5" fill="#52514e">Immigrants’ share of U.S. residents: 15.4%</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 760 440" role="img" aria-label="How the six 2026 medal honorees became Americans" font-size="11.5"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="hp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c1c1c1"></path></marker></defs><text x="24" y="32" font-size="16" font-weight="600" fill="#0b0b0b">Three arrived as children; two came to study and stayed on H-1B visas</text><text x="24" y="54" font-size="12" fill="#52514e">Each 2026 medal honoree’s path to U.S. citizenship</text><g><rect x="24" y="72" width="14" height="14" rx="3" fill="#2a78d6" fill-opacity="0.14" stroke="#2a78d6"></rect><text x="44" y="83" font-size="12" fill="#0b0b0b">Starting point</text><rect x="164" y="72" width="14" height="14" rx="3" fill="#2a78d6" fill-opacity="0.45" stroke="#2a78d6"></rect><text x="184" y="83" font-size="12" fill="#0b0b0b">H-1B work visa</text></g><g><text x="24" y="127" font-size="13" font-weight="600" fill="#0b0b0b">Elon Musk</text><text x="24" y="143" fill="#52514e">Pretoria, South Africa</text><g><rect x="184" y="112" width="96" height="36" rx="6" fill="#2a78d6" fill-opacity="0.14" stroke="#2a78d6"><title>Elon Musk: Via Canada (Queen’s)</title></rect><text x="232" y="127" text-anchor="middle" font-weight="400" fill="#0b0b0b">Via Canada</text><text x="232" y="141" text-anchor="middle" fill="#52514e">(Queen’s)</text></g><g><line x1="282" x2="294" y1="130" y2="130" stroke="#c1c1c1" marker-end="url(#hp-arrow)"></line><rect x="296" y="112" width="96" height="36" rx="6" fill="#c3c2b7" fill-opacity="0.18" stroke="#c1c1c1"><title>Elon Musk: Student visa Penn (J-1)</title></rect><text x="344" y="127" text-anchor="middle" font-weight="400" fill="#0b0b0b">Student visa</text><text x="344" y="141" text-anchor="middle" fill="#52514e">Penn (J-1)</text></g><g><line x1="394" x2="406" y1="130" y2="130" stroke="#c1c1c1" marker-end="url(#hp-arrow)"></line><rect x="408" y="112" width="96" height="36" rx="6" fill="#2a78d6" fill-opacity="0.45" stroke="#2a78d6"><title>Elon Musk: H-1B</title></rect><text x="456" y="134" text-anchor="middle" font-weight="600" fill="#0b0b0b">H-1B</text></g><g><line x1="506" x2="518" y1="130" y2="130" stroke="#c1c1c1" marker-end="url(#hp-arrow)"></line><rect x="520" y="112" width="96" height="36" rx="6" fill="#c3c2b7" fill-opacity="0.18" stroke="#c1c1c1"><title>Elon Musk: Green card</title></rect><text x="568" y="134" text-anchor="middle" font-weight="400" fill="#0b0b0b">Green card</text></g><g><line x1="618" x2="630" y1="130" y2="130" stroke="#c1c1c1" marker-end="url(#hp-arrow)"></line><rect x="632" y="112" width="96" height="36" rx="6" fill="#c3c2b7" fill-opacity="0.18" stroke="#c1c1c1"><title>Elon Musk: Citizen 2002</title></rect><text x="680" y="127" text-anchor="middle" font-weight="400" fill="#0b0b0b">Citizen</text><text x="680" y="141" text-anchor="middle" fill="#52514e">2002</text></g></g><g><text x="24" y="181" font-size="13" font-weight="600" fill="#0b0b0b">Sergey Brin</text><text x="24" y="197" fill="#52514e">Moscow, USSR</text><g><rect x="184" y="166" width="96" height="36" rx="6" fill="#2a78d6" fill-opacity="0.14" stroke="#2a78d6"><title>Sergey Brin: Refugee age 6, 1979</title></rect><text x="232" y="181" text-anchor="middle" font-weight="400" fill="#0b0b0b">Refugee</text><text x="232" y="195" text-anchor="middle" fill="#52514e">age 6, 1979</text></g><g><line x1="282" x2="294" y1="184" y2="184" stroke="#c1c1c1" marker-end="url(#hp-arrow)"></line><rect x="296" y="166" width="96" height="36" rx="6" fill="#c3c2b7" fill-opacity="0.18" stroke="#c1c1c1"><title>Sergey Brin: Citizen</title></rect><text x="344" y="188" text-anchor="middle" font-weight="400" fill="#0b0b0b">Citizen</text></g></g><g><text x="24" y="235" font-size="13" font-weight="600" fill="#0b
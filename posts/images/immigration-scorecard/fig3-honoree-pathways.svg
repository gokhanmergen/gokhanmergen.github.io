IT</text><text x="344" y="303" text-anchor="middle" fill="#52514e">BS, MS, PhD</text></g><g><line x1="394" x2="406" y1="292" y2="292" stroke="#c1c1c1" marker-end="url(#hp-arrow)"></line><rect x="408" y="274" width="96" height="36" rx="6" fill="#c3c2b7" fill-opacity="0.18" stroke="#c1c1c1"><title>Lisa Su: Citizen</title></rect><text x="456" y="296" text-anchor="middle" font-weight="400" fill="#0b0b0b">Citizen</text></g></g><g><text x="24" y="343" font-size="13" font-weight="600" fill="#0b0b0b">Satya Nadella</text><text x="24" y="359" fill="#52514e">Hyderabad, India</text><g><rect x="184" y="328" width="96" height="36" rx="6" fill="#2a78d6" fill-opacity="0.14" stroke="#2a78d6"><title>Satya Nadella: Student visa (F-1)</title></rect><text x="232" y="343" text-anchor="middle" font-weight="400" fill="#0b0b0b">Student visa</text><text x="232" y="357" text-anchor="middle" fill="#52514e">(F-1)</text></g><g><line x1="282" x2="294" y1="346" y2="346" stroke="#c1c1c1" marker-end="url(#hp-arrow)"></line><rect x="296" y="328" width="96" height="36" rx="6" fill="#2a78d6" fill-opacity="0.45" stroke="#2a78d6"><title>Satya Nadella: H-1B</title></rect><text x="344" y="350" text-anchor="middle" font-weight="600" fill="#0b0b0b">H-1B</text></g><g><line x1="394" x2="406" y1="346" y2="346" stroke="#c1c1c1" marker-end="url(#hp-arrow)"></line><rect x="408" y="328" width="96" height="36" rx="6" fill="#c3c2b7" fill-opacity="0.18" stroke="#c1c1c1"><title>Satya Nadella: Green card</title></rect><text x="456" y="350" text-anchor="middle" font-weight="400" fill="#0b0b0b">Green card</text></g><g><line x1="506" x2="518" y1="346" y2="346" stroke="#c1c1c1" marker-end="url(#hp-arrow)"></line><rect x="520" y="328" width="96" height="36" rx="6" fill="#c3c2b7" fill-opacity="0.18" stroke="#c1c1c1"><title>Satya Nadella: Citizen</title></rect><text x="568" y="350" text-anchor="middle" font-weight="400" fill="#0b0b0b">Citizen</text></g></g><g><text x="24" y="397" font-size="13" font-weight="600" fill="#0b0b0b"
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="13">
  <rect width="760" height="470" fill="#ffffff"/>
  <text x="0" y="24" font-size="17" font-weight="600" fill="#1a1a1a">Musk gave nearly three times as much as the next-largest donor</text>
  <text x="0" y="48" fill="#6b6b6b">Ten largest donors to the 2026 midterms, $ millions. R = Republican-leaning, D = Democratic-leaning.</text>
  <line x1="250" x2="250" y1="86" y2="392" stroke="#9a9a9a"/>
  <!-- rows: x0=250, scale=410/460, y0=92, row height=30 -->
  <g>
    <text x="240" y="111" text-anchor="end" fill="#1a1a1a">Elon Musk (R)</text>
    <rect x="250" y="98" width="397.5" height="18" fill="#2b6fd6"/>
    <text x="653.5" y="111" font-weight="600" fill="#1a1a1a">$446M</text>

    <text x="240" y="141" text-anchor="end" fill="#1a1a1a">Elizabeth &amp; Richard Uihlein (R)</text>
    <rect x="250" y="128" width="133.7" height="18" fill="#c9c7bf"/>
    <text x="389.7" y="141" fill="#1a1a1a">$150M</text>

    <text x="240" y="171" text-anchor="end" fill="#1a1a1a">One Nation (R)</text>
    <rect x="250" y="158" width="118.5" height="18" fill="#c9c7bf"/>
    <text x="374.5" y="171" fill="#1a1a1a">$133M</text>

    <text x="240" y="201" text-anchor="end" fill="#1a1a1a">Jeff &amp; Janine Yass (R)</text>
    <rect x="250" y="188" width="98.0" height="18" fill="#c9c7bf"/>
    <text x="354.0" y="201" fill="#1a1a1a">$110M</text>

    <text x="240" y="231" text-anchor="end" fill="#1a1a1a">George Soros (D)</text>
    <rect x="250" y="218" width="90.9" height="18" fill="#c9c7bf"/>
    <text x="346.9" y="231" fill="#1a1a1a">$102M</text>

    <text x="240" y="261" text-anchor="end" fill="#1a1a1a">Majority Forward (D)</text>
    <rect x="250" y="248" width="90.9" height="18" fill="#c9c7bf"/>
    <text x="346.9" y="261" fill="#1a1a1a">$102M</text>

    <text x="240" y="291" text-anchor="end" fill="#1a1a1a">House Majority Forward (D)</text>
    <rect x="250" y="278" width="83.5" height="18" fill="#c9c7bf"/>
    <text x="339.5" y="291" fill="#1a1a1a">$93.7M</text>

    <text x="240" y="321" text-anchor="end" fill="#1a1a1a">Ben Horowitz &amp; Marc Andreessen (R)</text>
    <rect x="250" y="308" width="82.2" height="18" fill="#c9c7bf"/>
    <text x="338.2" y="321" fill="#1a1a1a">$92.2M</text>

    <text x="240" y="351" text-anchor="end" fill="#1a1a1a">Mike Bloomberg (D)</text>
    <rect x="250" y="338" width="75.0" height="18" fill="#c9c7bf"/>
    <text x="331.0" y="351" fill="#1a1a1a">$84.2M</text>

    <text x="240" y="381" text-anchor="end" fill="#1a1a1a">Miriam Adelson (R)</text>
    <rect x="250" y="368" width="60.3" height="18" fill="#c9c7bf"/>
    <text x="316.3" y="381" fill="#1a1a1a">$67.6M</text>
  </g>
  <g>
    <line x1="627.4" x2="627.4" y1="86" y2="400" stroke="#8a8a8a" stroke-dasharray="4 3"/>
    <text x="621.4" y="418" text-anchor="end" fill="#6b6b6b">Five largest Democratic-leaning donors, combined</text>
    <text x="633.4" y="418" fill="#6b6b6b">$423M</text>
  </g>
  <text x="0" y="456" font-size="11" fill="#8a8a8a">Source: The Washington Post analysis of FEC filings through Oct. 23, 2026</text>
</svg>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beyond the Copper</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
  /* the loader is a 320x256 PIX screen, scaled up with hard pixels */
  #ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;cursor:pointer;user-select:none;transition:opacity .6s}
  #ui.hidden{opacity:0;pointer-events:none}
  #ld{height:min(100vh,80vw);aspect-ratio:5/4;image-rendering:pixelated;image-rendering:crisp-edges}
  #ui .dom{display:none}
  #hud{position:fixed;left:10px;top:8px;font:12px monospace;color:#0f0;text-shadow:1px 1px 0 #000;display:none;white-space:pre}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <canvas id="ld" width="320" height="256"></canvas>
  <div class="dom"><div id="status">INITIALISING CUSTOM CHIPS...</div><div id="bar"><div id="fill"></div></div><div id="err"></div><button id="go">CLICK TO START</button></div>
</div>
<div id="hud"></div>

<script src="js/music.js"></script>
<script src="js/leyenda_tab.js"></script>
<script src="js/leyenda.js"></script>
<script src="js/gfx.js"></script>
<script src="js/pix.js"></script>
<script src="js/scene_cracktro.js"></script>
<script src="js/boing_physics.js"></script>
<script src="js/scene_boing.js"></script>
<script src="js/scene_vector.js"></script>
<script src="js/scene_glenz.js"></script>
<script src="js/scene_tunnel.js"></script>
<script src="js/scene_fractal.js"></script>
<script src="js/scene_end.js"></script>
<script src="js/scene_disk2.js"></script>
<script src="js/scene_run.js"></script>
<script src="js/scene_shmup.js"></script>
<script src="js/scene_race.js"></script>
<script src="js/scene_courtyard.js"></script>
<script src="js/scene_pinball.js"></script>
<script src="js/scene_finale.js"></script>
<script src="js/main.js"></script>
</body>
</html>
